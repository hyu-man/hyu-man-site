<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひゅーまん</title>
<meta name="description" content="決まっているのに、わからない。">
<link rel="canonical" href="https://hyu-man.com/">
<meta property="og:type" content="music.musician">
<meta property="og:site_name" content="ひゅーまん">
<meta property="og:title" content="ひゅーまん">
<meta property="og:description" content="決まっているのに、わからない。">
<meta property="og:url" content="https://hyu-man.com/">
<meta property="og:image" content="https://hyu-man.com/og/hyu-man.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><rect width='8' height='8' fill='%23fff'/><rect x='1' y='5' width='3' height='1' fill='%23111'/><rect x='4' y='2' width='1' height='4' fill='%23111'/></svg>">
<style>
  :root { --ink:#111; --bg:#fff; --sub:#9a9a9a; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f2f2f2; --bg:#0a0a0a; --sub:#777; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; padding:40px 20px 64px;
  }
  h1 { font-size:14px; font-weight:700; letter-spacing:.42em; text-indent:.42em; margin:0 0 30px; }
  canvas {
    image-rendering:pixelated; display:block;
    width:min(440px, 84vw, 56vh); height:min(440px, 84vw, 56vh);
    aspect-ratio:1 / 1;
  }
  a {
    color:var(--ink); text-decoration:none;
    border-bottom:1px solid var(--ink); padding-bottom:3px; letter-spacing:.12em;
  }
  a:hover { background:var(--ink); color:var(--bg); border-color:transparent; }
  .links { margin-top:34px; display:flex; gap:26px; font-size:13px; }
  .play  { margin-top:16px; display:flex; gap:20px; font-size:11px; flex-wrap:wrap; justify-content:center; }
  .play a { color:var(--sub); border-bottom-color:var(--sub); letter-spacing:.08em; }
  .play a:hover { background:var(--sub); color:var(--bg); border-color:transparent; }
  .note { margin-top:22px; font-size:10px; color:var(--sub); letter-spacing:.14em; }
  .note a { color:var(--sub); border-bottom-color:var(--sub); }
  .note a:hover { background:var(--sub); color:var(--bg); border-color:transparent; }
  footer { position:fixed; bottom:18px; font-size:10px; color:var(--sub); letter-spacing:.22em; }
</style>
</head>
<body>

<h1>ひゅーまん</h1>

<canvas id="cv" width="121" height="121" aria-label="ラングトンの蟻"></canvas>

<div class="links">
  <a href="https://hyu-man.bandcamp.com/album/not-yet">(not yet)</a>
  <a href="https://hyu-man.bandcamp.com/album/life">LIFE</a>
</div>

<div class="play">
  <a href="/ant/">/ant/</a>
  <a href="/life/">/life/</a>
  <a href="/collatz/">/collatz/</a>
  <a href="/toad/">/toad/</a>
</div>

<div class="note">
  <a class="toad" href="https://x.com/hyu_man_rl" target="_blank" rel="noopener" aria-label="X">
    <span class="p0">(■_□)</span><span class="p1">(□_■)</span>
  </a>
</div>
<footer>決まっているのに、わからない</footer>

<script>
(() => {
  "use strict";
  const N = 121, M = 14, PER_FRAME = 16;
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];   // 上 右 下 左

  const cv  = document.getElementById("cv");
  const ctx = cv.getContext("2d", { alpha:false });
  const img = ctx.createImageData(N, N);
  const px  = img.data;
  for (let p = 3; p < px.length; p += 4) px[p] = 255;   // 不透明度は一度だけ

  const hex = s => {
    s = s.trim();
    if (s[0] !== "#") return null;
    if (s.length === 4) s = "#" + s[1]+s[1] + s[2]+s[2] + s[3]+s[3];
    return [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)];
  };
  let INK, BG;
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    INK = hex(cs.getPropertyValue("--ink")) || [17,17,17];
    BG  = hex(cs.getPropertyValue("--bg"))  || [255,255,255];
  }

  const grid = new Uint8Array(N * N);
  let x, y, dir, dirty;

  function blit() {                       // grid 全体を px に転写
    for (let i = 0, p = 0; i < N*N; i++, p += 4) {
      const c = grid[i] ? INK : BG;
      px[p] = c[0]; px[p+1] = c[1]; px[p+2] = c[2];
    }
  }
  function put(i, on) {
    const c = on ? INK : BG, p = i * 4;
    px[p] = c[0]; px[p+1] = c[1]; px[p+2] = c[2];
  }

  // 盤ごとずらす。外に出たぶんは捨てる（二度と戻らない）
  function shift(dx, dy) {
    if (dy === 1)       { grid.copyWithin(N, 0, N*(N-1)); grid.fill(0, 0, N); }
    else if (dy === -1) { grid.copyWithin(0, N, N*N);     grid.fill(0, N*(N-1)); }
    if (dx === 1) {
      for (let r = 0; r < N; r++) { const b = r*N; grid.copyWithin(b+1, b, b+N-1); grid[b] = 0; }
    } else if (dx === -1) {
      for (let r = 0; r < N; r++) { const b = r*N; grid.copyWithin(b, b+1, b+N); grid[b+N-1] = 0; }
    }
    dirty = true;
  }

  function reset() {
    grid.fill(0);
    x = y = N >> 1; dir = 0; dirty = true;
  }

  function step() {
    const i = y*N + x;
    const on = grid[i] ^ 1;               // 白なら右、黒なら左。踏んだ色を裏返して一歩
    grid[i] = on;
    dir = on ? (dir + 1) & 3 : (dir + 3) & 3;
    if (!dirty) put(i, on);
    x += DX[dir]; y += DY[dir];
    if (x >= N - M) { shift(-1, 0); x--; }
    if (x <  M)     { shift( 1, 0); x++; }
    if (y >= N - M) { shift(0, -1); y--; }
    if (y <  M)     { shift(0,  1); y++; }
  }

  function paint() {
    if (dirty) { blit(); dirty = false; }
    ctx.putImageData(img, 0, 0);          // 転送は1フレームに1回だけ
  }

  function frame() {
    for (let k = 0; k < PER_FRAME; k++) step();
    paint();
    requestAnimationFrame(frame);
  }

  readTheme();
  reset();

  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = () => { readTheme(); dirty = true; paint(); };
    mq.addEventListener ? mq.addEventListener("change", onChange) : mq.addListener(onChange);
  }

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    for (let k = 0; k < 14000; k++) step();   // 混沌を抜けて、ハイウェイが出たところで止める
    paint();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
