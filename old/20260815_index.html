<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひゅーまん</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><rect width='8' height='8' fill='%23fff'/><rect x='4' y='3' width='1' height='1' fill='%23111'/><rect x='5' y='4' width='1' height='1' fill='%23111'/><rect x='3' y='5' width='1' height='1' fill='%23111'/><rect x='4' y='5' width='1' height='1' fill='%23111'/><rect x='5' y='5' width='1' height='1' fill='%23111'/></svg>">
<meta name="description" content="ひゅーまん">
<meta property="og:type" content="music.musician">
<meta property="og:title" content="ひゅーまん">
<meta property="og:description" content="決まっているのに、わからない。">
<meta property="og:url" content="https://hyu-man.com/">
<meta property="og:image" content="https://f4.bcbits.com/img/a2231623848_10.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --ink:#111; --bg:#fff; --sub:#9a9a9a; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; padding:40px 20px;
  }
  h1 { font-size:14px; font-weight:700; letter-spacing:.42em; text-indent:.42em; margin:0 0 30px; }
  canvas {
    image-rendering:pixelated; display:block;
    width:min(440px, 84vw, 56vh); height:min(440px, 84vw, 56vh);
  }
  .links { margin-top:34px; display:flex; gap:26px; font-size:13px; }
  a {
    color:var(--ink); text-decoration:none;
    border-bottom:1px solid var(--ink); padding-bottom:3px; letter-spacing:.12em;
  }
  a:hover { background:var(--ink); color:var(--bg); border-color:transparent; }
  footer { position:fixed; bottom:18px; font-size:10px; color:var(--sub); letter-spacing:.22em; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f2f2f2; --bg:#0a0a0a; --sub:#777; }
  }
  .links { margin-top:34px; display:flex; gap:26px; font-size:13px; }
  .play  { margin-top:16px; display:flex; gap:22px; font-size:11px; }
  .play a { color:var(--sub); border-bottom-color:var(--sub); letter-spacing:.08em; }
  .play a:hover { background:var(--sub); color:var(--bg); border-color:transparent; }
</style>
</head>
<body>
<h1>ひゅーまん</h1>
<canvas id="cv" width="121" height="121"></canvas>
<div class="links">
  <a href="https://hyu-man.bandcamp.com/album/not-yet">(not yet)</a>
  <a href="https://hyu-man.bandcamp.com/album/life">LIFE</a>
</div>
<div class="play">
  <a href="/ant/">/ant/</a>
  <a href="/life/">/life/</a>
  <a href="/collatz/">/collatz/</a>
</div>
<footer>決まっているのに、わからない</footer>
<script>
(() => {
  "use strict";
  const N = 121, DX = [0,1,0,-1], DY = [-1,0,1,0];
  const cv  = document.getElementById("cv");
  const ctx = cv.getContext("2d", { alpha:false });
  const hex = s => { s = s.trim();
    if (s[0] !== "#") return null;
    if (s.length === 4) s = "#"+s[1]+s[1]+s[2]+s[2]+s[3]+s[3];
    return [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)];
  };
  const cs  = getComputedStyle(document.documentElement);
  const INK = hex(cs.getPropertyValue("--ink")) || [17,17,17];
  const BG  = hex(cs.getPropertyValue("--bg"))  || [255,255,255];
  const img = ctx.createImageData(N, N);
  const px  = img.data;
  let grid, x, y, dir;
  function put(i, on) {
    const c = on ? INK : BG, p = i*4;
    px[p] = c[0]; px[p+1] = c[1]; px[p+2] = c[2]; px[p+3] = 255;
  }
  function reset() {
    grid = new Uint8Array(N*N);
    x = y = N >> 1; dir = 0;
    for (let i = 0; i < N*N; i++) put(i, 0);
  }
  function step() {
    const i = y*N + x;
    const on = grid[i] ^ 1;
    grid[i] = on;
    dir = on ? (dir+1) & 3 : (dir+3) & 3;
    put(i, on);
    x = (x + DX[dir] + N) % N;
    y = (y + DY[dir] + N) % N;
  }
  let steps = 0;
  function frame() {
    for (let k = 0; k < 70; k++) step();
    steps += 70;
    if (steps > 260000) { steps = 0; reset(); }
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(frame);
  }
  reset();
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    for (let k = 0; k < 11000; k++) step();
    ctx.putImageData(img, 0, 0);
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
