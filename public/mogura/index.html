<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mogura — ひゅーまん</title>
<meta name="description" content="地面の下で、小さな世界が動いている。mogura のミュージックビデオ。">

<meta property="og:type" content="video.other">
<meta property="og:site_name" content="ひゅーまん">
<meta property="og:title" content="mogura — ひゅーまん">
<meta property="og:description" content="地面の下で、小さな世界が動いている。">
<meta property="og:url" content="https://hyu-man.com/mogura/">
<meta property="og:image" content="https://hyu-man.com/mogura/poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--soil:#17120f;--deep:#0b0908;--ink:#f4eadc;--muted:#a99887;--line:#3a2d25;--warm:#df9f61}
*{box-sizing:border-box}body{margin:0;background:var(--deep);color:var(--ink);font-family:DotGothic16,monospace;min-height:100vh}
a{color:inherit;text-underline-offset:5px}a:focus-visible,button:focus-visible,video:focus-visible{outline:3px solid var(--warm);outline-offset:4px}
header{height:66px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}header a{text-decoration:none}header a:hover{color:var(--ink)}
.hero{text-align:center;padding:34px 16px 30px}.eyebrow{font-size:10px;letter-spacing:.32em;color:var(--warm)}h1{font-size:clamp(54px,10vw,128px);font-weight:400;letter-spacing:.12em;text-indent:.12em;margin:12px 0 4px;line-height:1}.lead{color:var(--muted);font-size:13px;line-height:2;margin:18px 0 0}
.stage{width:min(1180px,94vw);margin:0 auto 48px;border:1px solid var(--line);background:var(--soil);box-shadow:14px 14px 0 #050403}.ribbon{display:flex;justify-content:space-between;gap:20px;padding:12px 15px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.13em;color:var(--muted)}
.screen{position:relative;aspect-ratio:16/9;background:#000}.screen video{display:block;width:100%;height:100%;object-fit:contain;background:#000}.start{position:absolute;inset:0;display:grid;place-content:center;background:linear-gradient(180deg,#0b090844,#0b0908cc)}.start[hidden]{display:none}.start button{font:inherit;border:1px solid var(--ink);background:var(--deep);color:var(--ink);padding:16px 28px;box-shadow:5px 5px 0 var(--warm);cursor:pointer}.start span{text-align:center;color:var(--muted);font-size:10px;margin-top:16px}
.caption{text-align:center;padding:24px 16px 8px;color:var(--muted);font-size:12px;line-height:2}.caption strong{display:block;color:var(--ink);font-size:17px;font-weight:400;margin-bottom:8px}.links{text-align:center;padding:14px 16px 55px;font-size:11px;line-height:2.4;color:var(--muted)}
@media(max-width:600px){header{height:54px;padding:0 20px}.hero{padding-top:23px}h1{font-size:48px}.stage{box-shadow:6px 6px 0 #050403}.ribbon{font-size:8px}.start button{padding:13px 22px}}
</style>
</head>
<body>
<header><a href="/">ひゅーまん</a><a href="/uta/">うたへ ↗</a></header>
<main>
  <section class="hero">
    <div class="eyebrow">A SMALL WORLD UNDERFOOT</div>
    <h1>mogura</h1>
    <p class="lead">上では、何も起きていない。<br>下では、ずっと動いている。</p>
  </section>
  <section class="stage" aria-label="mogura のミュージックビデオ">
    <div class="ribbon"><span>ひゅーまん / mogura</span><span>UNDER THE SAME GROUND</span></div>
    <div class="screen">
      <video id="film" controls playsinline preload="metadata" poster="poster.jpg">
        <source src="mogura.mp4" type="video/mp4">
        動画を再生できないブラウザです。
      </video>
      <div class="start" id="start"><button id="play">▶ この場所で、みる</button><span>音が出ます</span></div>
    </div>
    <div class="caption"><strong>mogura</strong>見えない場所にも、ちゃんと暮らしがある。</div>
  </section>
</main>
<footer class="links"><a href="/uta/">うたへ帰る</a><br><a href="mogura.mp4">動画を直接開く ↗</a></footer>
<script>
(()=>{const v=document.getElementById('film'),s=document.getElementById('start'),b=document.getElementById('play');b.addEventListener('click',async()=>{try{await v.play();s.hidden=true}catch(e){v.controls=true}});v.addEventListener('play',()=>s.hidden=true);v.addEventListener('ended',()=>s.hidden=false)})();
</script>
</body>
</html>
