<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひゅーまん</title>
<meta name="description" content="ひゅーまん — (not yet)">
<meta property="og:type" content="music.musician">
<meta property="og:title" content="ひゅーまん">
<meta property="og:description" content="(not yet) — 9 tracks">
<meta property="og:url" content="https://hyu-man.com/">
<meta property="og:image" content="https://f4.bcbits.com/img/a2231623848_10.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><rect width='8' height='8' fill='%23fff'/><rect x='2' y='2' width='4' height='4' fill='%23111'/></svg>">
<style>
  :root { --ink:#111; --bg:#fff; --sub:#9a9a9a; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; padding:40px 20px; gap:0;
  }
  h1 {
    font-size:14px; font-weight:700; letter-spacing:.42em;
    margin:0 0 26px; text-indent:.42em;
  }
  canvas {
    image-rendering:pixelated; display:block;
    width:min(320px, 74vw); height:min(320px, 74vw);
  }
  .meta {
    margin-top:26px; font-size:12px; color:var(--sub);
    letter-spacing:.1em; line-height:2.1; text-align:center;
  }
  .meta b { color:var(--ink); font-weight:700; letter-spacing:.14em; }
  a {
    color:var(--ink); text-decoration:none;
    border-bottom:1px solid var(--ink); padding-bottom:2px;
    letter-spacing:.1em;
  }
  a:hover { background:var(--ink); color:var(--bg); border-color:transparent; }
  .links { margin-top:24px; display:flex; gap:22px; font-size:12px; }
  footer {
    position:fixed; bottom:16px; font-size:10px; color:var(--sub);
    letter-spacing:.2em;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f2f2f2; --bg:#0a0a0a; --sub:#777; }
  }
</style>
</head>
<body>

<h1>ひゅーまん</h1>

<canvas id="cv" width="121" height="121" aria-label="Langton's ant"></canvas>

<p class="meta">
  <b>(not yet)</b><br>
  9 tracks / 18:22
</p>

<div class="links">
  <a href="https://hyu-man.bandcamp.com/album/not-yet">聴く / listen</a>
</div>

<footer>白なら右　黒なら左</footer>

<script>
(() => {
  "use strict";
  const N = 121, D = [[0,-1],[1,0],[0,1],[-1,0]];
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d", { alpha:false });
  const cs = getComputedStyle(document.documentElement);
  const ink = cs.getPropertyValue("--ink").trim() || "#111";
  const bg  = cs.getPropertyValue("--bg").trim()  || "#fff";

  let grid, x, y, dir;
  function reset() {
    grid = new Uint8Array(N*N);
    x = y = N >> 1; dir = 0;
    ctx.fillStyle = bg; ctx.fillRect(0, 0, N, N);
  }
  function step() {
    const i = y*N + x;
    if (grid[i]) { grid[i] = 0; dir = (dir+3) & 3; }
    else         { grid[i] = 1; dir = (dir+1) & 3; }
    ctx.fillStyle = grid[i] ? ink : bg;
    ctx.fillRect(x, y, 1, 1);
    x = (x + D[dir][0] + N) % N;
    y = (y + D[dir][1] + N) % N;
  }

  let steps = 0;
  function frame() {
    for (let k = 0; k < 90; k++) step();
    steps += 90;
    if (steps > 260000) { steps = 0; reset(); }   // 走りきったら最初から
    requestAnimationFrame(frame);
  }

  reset();
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    requestAnimationFrame(frame);
  } else {
    for (let k = 0; k < 120000; k++) step();      // 動きが苦手な人には静止画で
  }
})();
</script>
</body>
</html>
