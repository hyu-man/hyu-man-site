<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かぞえる — ひゅーまん</title>
<meta name="description" content="とまるとわかっています。でも、見とどけられません。">
<link rel="canonical" href="https://hyu-man.com/count/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ひゅーまん">
<meta property="og:title" content="かぞえる — ひゅーまん">
<meta property="og:description" content="とまるとわかっています。でも、見とどけられません。">
<meta property="og:url" content="https://hyu-man.com/count/">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><rect width='8' height='8' fill='%23f5f3f0'/><rect x='1' y='3' width='1' height='2' fill='%23111'/><rect x='3' y='2' width='1' height='4' fill='%23111'/><rect x='5' y='1' width='1' height='6' fill='%23111'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Hachi+Maru+Pop&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#f5f3f0; --ink:#1a1a1a; --sub:#b0a8a0; --line:#e2ded9; --cheek:#ff96aa;
    --dot:'Press Start 2P','DotGothic16','Courier New',monospace;
    --maru:'Hachi Maru Pop','DotGothic16',sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d0d0c; --ink:#e9e9e6; --sub:#65625e; --line:#212120; }
  }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--ink); font-family:var(--maru);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; padding:34px 16px 44px;
  }
  h1 { font-family:var(--dot); font-size:12px; font-weight:400;
       letter-spacing:.32em; text-indent:.32em; color:var(--sub); margin-bottom:26px; }

  .num {
    font-family:var(--dot); font-variant-numeric:tabular-nums;
    font-size:clamp(26px,7vw,66px); letter-spacing:.03em; line-height:1;
  }
  .yomi {
    margin-top:16px; font-size:clamp(13px,2.4vw,19px); letter-spacing:.3em;
    color:var(--sub); min-height:1.6em;
  }
  .yomi b { color:var(--cheek); font-weight:400; }

  canvas { margin-top:30px; width:min(620px,94vw); height:auto;
           aspect-ratio:620 / 54; image-rendering:pixelated; display:block; }

  .bar { display:flex; flex-wrap:wrap; gap:9px; align-items:center;
         justify-content:center; margin-top:26px; }
  button {
    font-family:var(--maru); font-size:13px; letter-spacing:.06em;
    background:var(--bg); color:var(--ink); border:1px solid var(--ink);
    padding:5px 15px; cursor:pointer; border-radius:2px;
  }
  button:hover { background:var(--ink); color:var(--bg); }
  button.on { background:var(--cheek); border-color:var(--cheek); color:var(--bg); }
  button.rec { border-style:dashed; }
  button:disabled { opacity:.35; cursor:default; }
  button:disabled:hover { background:var(--bg); color:var(--ink); }
  #dl { display:none; font-size:12px; margin-top:10px; }
  #dl a { color:var(--cheek); }

  .note { margin-top:30px; max-width:620px; font-size:12.5px;
          line-height:2.1; color:var(--sub); text-align:center; }
  .note b { color:var(--ink); font-weight:400; }
  .note .q { color:var(--cheek); }
  nav { margin-top:30px; font-family:var(--dot); font-size:9px;
        letter-spacing:.1em; color:var(--sub); }
  nav a { color:var(--sub); text-decoration:none; margin-right:12px; }
  nav a:hover { color:var(--ink); }
  @media (max-width:620px) { .note { font-size:12px; } nav a { margin-right:9px; } }
</style>
</head>
<body>

<h1>かぞえる</h1>

<div class="num" id="num">0</div>
<div class="yomi" id="yomi"></div>

<canvas id="cv" width="620" height="54" aria-label="テープの上を歩く機械"></canvas>

<div class="bar">
  <button id="snd">こえ</button>
  <button id="vsw">たかいこえ</button>
  <button id="rec" class="rec" disabled>ろくおん</button>
  <button id="reset">さいしょから</button>
</div>
<div id="dl"></div>

<p class="note">
  5じょうたいのビジービーバー。テープの上を、きまった規則どおりに歩いています。<br>
  この子は <b>47,176,870ほ</b>で とまります。それが確定したのは <b>2024年</b>。<br>
  一歩ずつ声に出して数えると、<b>4.5年</b>かかります。<br>
  数が長くなるほど、読むのに時間がかかる。<b>進むほど、遅くなる。</b><br>
  <span class="q">とまるとわかっています。でも、見とどけられません。</span><br>
  6じょうたいの子が とまるかどうかは、まだ だれも しりません。
</p>

<nav>
  <a href="/">ひゅーまん</a><a href="/halt/">/halt/</a><a href="/liar/">/liar/</a><a href="/film/">/film/</a><a href="/still/">/still/</a>
</nav>

<script>
(() => {
  "use strict";
  // ---- 機械（5じょうたい。検算済み：47,176,870歩で停止） ----------------
  const T = {
    A:[[1, 1,"B"],[1,-1,"C"]], B:[[1, 1,"C"],[1, 1,"B"]],
    C:[[1, 1,"D"],[0,-1,"E"]], D:[[1,-1,"A"],[1,-1,"D"]],
    E:[[1, 1,"H"],[0,-1,"A"]]
  };
  const SIZE = 1 << 16, ORG = SIZE >> 1;
  let tape = new Uint8Array(SIZE), pos = 0, st = "A", n = 0, halted = false;

  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d", { alpha:false });
  const cssv = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  let INK, BG, SUB, LINE, CHEEK;
  const theme = () => { INK=cssv('--ink'); BG=cssv('--bg'); SUB=cssv('--sub');
                        LINE=cssv('--line'); CHEEK=cssv('--cheek'); };
  theme();

  function step() {
    if (halted) return;
    const a = T[st][tape[ORG+pos]];
    tape[ORG+pos] = a[0]; pos += a[1]; n++;
    if (a[2] === "H") halted = true; else st = a[2];
  }
  function reset() {
    tape.fill(0); pos = 0; st = "A"; n = 0; halted = false;
    $("num").textContent = "0"; $("yomi").innerHTML = "";
    draw();
  }

  const CELL = 10, VIEW = 62;
  function draw() {
    ctx.fillStyle = BG; ctx.fillRect(0,0,620,54);
    ctx.fillStyle = LINE; ctx.fillRect(0, 42, 620, 1);
    ctx.fillStyle = INK;
    const mid = VIEW >> 1;
    for (let i = 0; i < VIEW; i++)
      if (tape[ORG + pos + i - mid]) ctx.fillRect(i*CELL, 33, CELL, 9);
    const cx = mid*CELL + (CELL>>1);
    ctx.fillRect(cx-9, 14, 18, 19); ctx.fillRect(cx-11, 18, 22, 12);
    ctx.fillStyle = CHEEK; ctx.fillRect(cx-10, 25, 4, 3); ctx.fillRect(cx+6, 25, 4, 3);
    ctx.fillStyle = BG;
    if (halted) { ctx.fillRect(cx-7, 22, 5, 1); ctx.fillRect(cx+2, 22, 5, 1); }
    else        { ctx.fillRect(cx-7, 20, 4, 4); ctx.fillRect(cx+3, 20, 4, 4); }
  }

  // ---- こえ（フォルマント合成） -----------------------------------------
  // ノコギリ波を「声帯」に、バンドパス3本を「口の形」にする。
  // 抑揚をつけない。音を階段状に切り替える。残響を長くする。
  const VOICES = {
    high: {                              // F0 = B3。E major の第5音
      f0: 246.94, lp: 5400, dur: 0.175, breath: 0.075, g3: 0.30,
      V: { a:[ 888,1363,3000], i:[ 325,2725,3400], u:[ 375,1675,2900],
           e:[ 483,2317,3100], o:[ 483, 925,2850], n:[ 300,1200,2500] }
    },
    low: {                               // F0 = B2。ちょうど1オクターブ下
      f0: 123.47, lp: 4200, dur: 0.19, breath: 0.0, g3: 0.22,
      V: { a:[ 775,1163,2600], i:[ 263,2263,3000], u:[ 363,1300,2400],
           e:[ 475,1963,2700], o:[ 550, 838,2500], n:[ 250,1000,2200] }
    }
  };
  let VC = VOICES.high;

  //  よみ, 母音, 子音の種類（v=なし/有声  f=すきま音  p=はじく音）
  const M = {
    "ぜ":["e","f"], "ろ":["o","v"], "い":["i","v"], "ち":["i","f"],
    "に":["i","v"], "さ":["a","f"], "ん":["n","v"], "よ":["o","v"],
    "ご":["o","p"], "く":["u","p"], "な":["a","v"], "は":["a","f"],
    "きゅ":["u","p"], "う":["u","v"]
  };
  const DIGIT = [["ぜ","ろ"],["い","ち"],["に"],["さ","ん"],["よ","ん"],
                 ["ご"],["ろ","く"],["な","な"],["は","ち"],["きゅ","う"]];

  let ac = null, dry = null, wet = null, out = null, dest = null, hiss = null;

  function initAudio() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    out = ac.createGain(); out.gain.value = 0.9;
    out.connect(ac.destination);
    dest = ac.createMediaStreamDestination(); out.connect(dest);

    const conv = ac.createConvolver();
    const len = Math.floor(ac.sampleRate * 4.6), ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++)
        d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 2.7);
    }
    conv.buffer = ir;
    dry = ac.createGain(); dry.gain.value = 0.26;      // 声は前に出てこない
    wet = ac.createGain(); wet.gain.value = 0.95;      // 残響のほうが長い
    dry.connect(out); wet.connect(conv); conv.connect(out);

    hiss = ac.createBuffer(1, Math.floor(ac.sampleRate*0.5), ac.sampleRate);
    const hd = hiss.getChannelData(0);
    for (let i = 0; i < hd.length; i++) hd[i] = Math.random()*2 - 1;
  }
  const bus = node => { node.connect(dry); node.connect(wet); };

  function mora(ch, t) {
    const m = M[ch]; if (!m) return VC.dur;
    const f = VC.V[m[0]], dur = m[0] === "n" ? VC.dur * 0.74 : VC.dur;
    if (m[1] !== "v") {                                 // 子音
      const nb = ac.createBufferSource();
      const b = ac.createBuffer(1, Math.floor(ac.sampleRate*0.05), ac.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
      nb.buffer = b;
      const bp = ac.createBiquadFilter(); bp.type = "bandpass";
      bp.frequency.value = m[1] === "p" ? 2600 : 5000; bp.Q.value = 1.1;
      const g = ac.createGain();
      const len = m[1] === "p" ? 0.022 : 0.05;
      g.gain.setValueAtTime(m[1] === "p" ? 0.09 : 0.065, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      nb.connect(bp).connect(g); bus(g);
      nb.start(t); nb.stop(t + len + 0.01);
    }
    const amp = ac.createGain();
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.linearRampToValueAtTime(0.5, t + 0.018);
    amp.gain.setValueAtTime(0.5, t + dur - 0.05);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = VC.lp;

    const o = ac.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(VC.f0, t);               // 抑揚をつけない
    let br = null;
    if (VC.breath > 0) {                                // 息を混ぜる
      br = ac.createBufferSource(); br.buffer = hiss; br.loop = true;
      var brg = ac.createGain(); brg.gain.value = VC.breath;
      br.connect(brg);
    }
    const gains = [0.9, 0.55, VC.g3];
    for (let i = 0; i < 3; i++) {
      const bp = ac.createBiquadFilter(); bp.type = "bandpass";
      bp.frequency.value = f[i]; bp.Q.value = 8;
      const g = ac.createGain(); g.gain.value = gains[i];
      o.connect(bp); if (br) brg.connect(bp);
      bp.connect(g).connect(amp);
    }
    amp.connect(lp); bus(lp);
    o.start(t); o.stop(t + dur + 0.02);
    if (br) { br.start(t); br.stop(t + dur + 0.02); }
    return dur;
  }

  function speakNumber(v) {
    const ds = String(v).split("").map(d => DIGIT[+d]);
    const flat = [];
    ds.forEach((mm, i) => { mm.forEach(c => flat.push(c)); if (i < ds.length-1) flat.push(null); });
    let t = ac.currentTime + 0.04, total = 0;
    const marks = [];
    for (const c of flat) {
      if (c === null) { t += 0.09; total += 0.09; continue; }
      marks.push({ at: total, ch: c });
      const d = mora(c, t); t += d + 0.012; total += d + 0.012;
    }
    // 読んでいる文字を光らせる
    const line = ds.map(mm => mm.join("")).join("・");
    $("yomi").textContent = line;
    return total + 0.35;                                 // 数字ごとの間
  }

  // ---- ループ ----------------------------------------------------------
  let voice = false, nextAt = 0;
  function tick(t) {
    if (voice && ac && !halted && t >= nextAt) {
      step();
      $("num").textContent = n.toLocaleString("ja-JP");
      const wait = speakNumber(n);
      nextAt = t + wait*1000;
      draw();
      if (halted) { $("yomi").innerHTML = "<b>とまった</b>"; }
    }
    requestAnimationFrame(tick);
  }

  // ---- ろくおん --------------------------------------------------------
  let rec = null, chunks = [], recording = false;
  const pickMime = () => ["video/mp4","video/webm;codecs=vp9,opus",
                          "video/webm;codecs=vp8,opus","video/webm"]
      .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  function startRec() {
    if (!ac) return;
    const vs = cv.captureStream(12);
    const mixed = new MediaStream([...vs.getVideoTracks(), ...dest.stream.getAudioTracks()]);
    const mime = pickMime();
    rec = new MediaRecorder(mixed, mime ? { mimeType: mime } : undefined);
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const type = (rec.mimeType || mime || "video/webm").split(";")[0];
      const ext = type.indexOf("mp4") >= 0 ? "mp4" : "webm";
      const url = URL.createObjectURL(new Blob(chunks, { type }));
      const d = $("dl"); d.style.display = "block";
      d.innerHTML = '<a href="' + url + '" download="count_' + n + '.' + ext +
                    '">count_' + n + '.' + ext + ' をダウンロード</a>';
    };
    rec.start(); recording = true;
    $("rec").classList.add("on"); $("rec").textContent = "ろくおん中";
  }
  function stopRec() {
    if (rec && rec.state !== "inactive") rec.stop();
    recording = false;
    $("rec").classList.remove("on"); $("rec").textContent = "ろくおん";
  }

  $("snd").onclick = e => {
    initAudio();
    if (ac.state === "suspended") ac.resume();
    voice = !voice;
    e.target.classList.toggle("on", voice);
    e.target.textContent = voice ? "かぞえてる" : "こえ";
    $("rec").disabled = !voice;
    nextAt = 0;
  };
  $("vsw").onclick = e => {
    VC = (VC === VOICES.high) ? VOICES.low : VOICES.high;
    e.target.textContent = (VC === VOICES.high) ? "たかいこえ" : "ひくいこえ";
  };
  $("rec").onclick = () => { recording ? stopRec() : startRec(); };
  $("reset").onclick = () => { reset(); nextAt = 0; };
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const oc = () => { theme(); draw(); };
    mq.addEventListener ? mq.addEventListener("change", oc) : mq.addListener(oc);
  }

  reset();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
