<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沼のふち — ひゅーまん</title>
<meta name="description" content="つつかなければ、128世代で最初に戻る。">
<link rel="canonical" href="https://hyu-man.com/toad/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ひゅーまん">
<meta property="og:title" content="沼のふち — ひゅーまん">
<meta property="og:description" content="つつかなければ、128世代で最初に戻る。">
<meta property="og:url" content="https://hyu-man.com/toad/">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><rect width='8' height='8' fill='%23f2f2f0'/><rect x='1' y='2' width='2' height='2' fill='%23111'/><rect x='5' y='2' width='2' height='2' fill='%23111'/><rect x='1' y='5' width='6' height='1' fill='%23111'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&family=Hachi+Maru+Pop&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --paper:#f2f2f0; --water:#e8e8e5; --lily:#e0e0dc;
    --ink:#141414; --sub:#a9a9a4; --cheek:#ff96aa;
    --dot:'Press Start 2P','DotGothic16','Courier New',monospace;
    --maru:'Hachi Maru Pop','DotGothic16',sans-serif;
  }
  html,body { height:100%; background:var(--paper); color:var(--ink); }
  body {
    font-family:var(--maru);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; padding:28px 16px 44px;
  }
  h1 { font-family:var(--dot); font-size:13px; font-weight:400;
       letter-spacing:.16em; margin:0 0 5px; }
  .rule { font-family:var(--dot); font-size:9px; color:var(--sub);
          letter-spacing:.1em; margin:0 0 18px; }

  .wrap { width:100%; max-width:840px; }
  canvas {
    width:100%; height:auto; display:block; aspect-ratio:64 / 40;
    image-rendering:pixelated; image-rendering:crisp-edges;
    border:1px solid var(--ink); cursor:crosshair; touch-action:manipulation;
  }

  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
  button {
    font-family:var(--maru); font-size:13px; letter-spacing:.06em;
    background:var(--paper); color:var(--ink);
    border:1px solid var(--ink); padding:5px 15px; cursor:pointer; border-radius:2px;
  }
  button:hover { background:var(--ink); color:var(--paper); }
  button.poke { border-style:dashed; }
  button.poke:hover { background:var(--cheek); border-color:var(--cheek); color:var(--paper); }
  .spacer { flex:1 }
  .read { font-family:var(--dot); font-size:11px; color:var(--sub);
          font-variant-numeric:tabular-nums; letter-spacing:.04em; }
  .read b { color:var(--ink); }
  input[type=range] { width:96px; accent-color:var(--ink); }

  #status { min-height:2em; font-size:13px; letter-spacing:.04em; margin-top:9px; }
  #status.poked { color:var(--cheek); }
  .note { margin-top:12px; font-size:12px; line-height:2; color:var(--sub); }
  .note b { color:var(--ink); font-weight:400; }
  nav { margin-top:26px; font-family:var(--dot); font-size:9px;
        letter-spacing:.1em; color:var(--sub); }
  nav a { color:var(--sub); text-decoration:none; margin-right:13px; }
  nav a:hover { color:var(--ink); }
</style>
</head>
<body>

<div class="wrap">
  <h1>沼のふち</h1>
  <p class="rule">B3/S23 &nbsp;·&nbsp; toad — period 2</p>

  <canvas id="cv" width="384" height="240" aria-label="ライフゲームの沼とカエル"></canvas>

  <div class="bar">
    <button id="play">とめる</button>
    <button id="stepb">1こずつ</button>
    <button id="poke" class="poke">つつく</button>
    <button id="reset">もどす</button>
    <span class="spacer"></span>
    <input type="range" id="speed" min="1" max="30" value="8" aria-label="はやさ">
    <span class="read">世代 <b id="gen">0</b> / いきてる <b id="pop">0</b></span>
  </div>

  <div id="status"></div>

  <p class="note">
    <b>トード</b>はライフゲームに実在する周期2のオシレータ。
    ふくらんで、しぼんで、一マスも動かない。<br>
    上を流れているのは<b>軽量宇宙船</b>。c/2 ですすむ。
    どちらも同じ規則の出力で、<b>動かないほうも生きている</b>。<br>
    顔だけは規則じゃない。こっちで描いた。
  </p>

  <nav>
    <a href="/">ひゅーまん</a><a href="/ant/">/ant/</a><a href="/life/">/life/</a><a href="/collatz/">/collatz/</a><a href="/film/">/film/</a>
  </nav>
</div>

<script>
(() => {
  "use strict";
  const ROWS = 40, COLS = 64, S = 6, WATER = 28, PERIOD = 2 * COLS;
  const W = COLS * S, H = ROWS * S, N = ROWS * COLS;

  const TOAD_A = [[0,1],[0,2],[0,3],[1,0],[1,1],[1,2]];
  const TOAD_B = [[-1,2],[0,0],[0,3],[1,0],[1,3],[2,1]];
  const BLOCK  = [[0,0],[0,1],[1,0],[1,1]];
  const BLINK  = [[0,0],[0,1],[0,2]];
  const LWSS   = [[0,0],[0,3],[1,4],[2,0],[2,4],[3,1],[3,2],[3,3],[3,4]];
  const GLIDER = [[0,1],[1,2],[2,0],[2,1],[2,2]];

  const TOAD_AT  = [[21,6],[22,18],[21,30],[22,42],[21,54]];
  const BLOCK_AT = [[18,12],[18,36],[25,24],[18,48]];
  const BLINK_AT = [[31,10],[34,26],[32,44],[36,57]];
  const LWSS_AT  = [[2,4],[9,34]];
  const LILY     = [[33,16,3.0],[30,38,2.4],[35,50,2.8],[37,8,2.2]];

  const cv  = document.getElementById('cv');
  const ctx = cv.getContext('2d', { alpha:false });
  const img = ctx.createImageData(W, H), px = img.data;
  for (let p = 3; p < px.length; p += 4) px[p] = 255;

  let PAPER, WATERC, LILYC, INK, CHEEK;
  const hex = s => { s = s.trim();
    if (s.length === 4) s = "#"+s[1]+s[1]+s[2]+s[2]+s[3]+s[3];
    return [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)]; };
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    PAPER = hex(cs.getPropertyValue('--paper')); WATERC = hex(cs.getPropertyValue('--water'));
    LILYC = hex(cs.getPropertyValue('--lily'));  INK    = hex(cs.getPropertyValue('--ink'));
    CHEEK = hex(cs.getPropertyValue('--cheek'));
  }
  readTheme();

  let grid = new Uint8Array(N), next = new Uint8Array(N);
  let gen = 0, running = true, timer = null;
  const face = TOAD_AT.map(() => ({ alive:true, blink:0, wide:0, bang:0, yawn:0 }));

  const idx = (r,c) => ((r%ROWS+ROWS)%ROWS)*COLS + ((c%COLS+COLS)%COLS);
  const put = (pat,r,c) => { for (const p of pat) grid[idx(r+p[0], c+p[1])] = 1; };

  const say = (t, poked) => {
    const el = document.getElementById('status');
    el.textContent = t; el.classList.toggle('poked', !!poked);
  };

  function build() {
    grid.fill(0); next.fill(0);
    for (const a of TOAD_AT)  put(TOAD_A, a[0], a[1]);
    for (const a of BLOCK_AT) put(BLOCK,  a[0], a[1]);
    for (const a of BLINK_AT) put(BLINK,  a[0], a[1]);
    for (const a of LWSS_AT)  put(LWSS,   a[0], a[1]);
    gen = 0;
    face.forEach(f => { f.alive = true; f.blink = f.wide = f.bang = f.yawn = 0; });
    say('つついていない。' + PERIOD + '世代で、ぜんぶ最初にもどる。', false);
  }

  function step() {
    for (let r = 0; r < ROWS; r++) {
      const up = ((r+ROWS-1)%ROWS)*COLS, mi = r*COLS, dn = ((r+1)%ROWS)*COLS;
      for (let c = 0; c < COLS; c++) {
        const l = (c+COLS-1)%COLS, x = (c+1)%COLS;
        const n = grid[up+l]+grid[up+c]+grid[up+x]
                + grid[mi+l]          +grid[mi+x]
                + grid[dn+l]+grid[dn+c]+grid[dn+x];
        next[mi+c] = (n===3 || (n===2 && grid[mi+c])) ? 1 : 0;
      }
    }
    const t = grid; grid = next; next = t;
    gen++;
    // トードがトードのままか確かめる。崩れたら顔も消える
    TOAD_AT.forEach((a,i) => {
      const ok = p => p.every(o => grid[idx(a[0]+o[0], a[1]+o[1])] === 1);
      face[i].alive = ok(TOAD_A) || ok(TOAD_B);
    });
  }

  // ---- 描画（1セル = S x S サブピクセル） ----
  function fill(x, y, w, h, col) {
    const x0 = Math.max(0,x|0), y0 = Math.max(0,y|0);
    const x1 = Math.min(W,(x+w)|0), y1 = Math.min(H,(y+h)|0);
    for (let yy = y0; yy < y1; yy++) {
      let p = (yy*W + x0)*4;
      for (let xx = x0; xx < x1; xx++, p += 4) {
        px[p] = col[0]; px[p+1] = col[1]; px[p+2] = col[2];
      }
    }
  }
  function disc(cy, cx, rr, col) {
    const R = rr*S, r2 = R*R, ccy = cy*S, ccx = cx*S;
    const y0 = Math.max(0, (ccy-R)|0), y1 = Math.min(H, (ccy+R+1)|0);
    const x0 = Math.max(0, (ccx-R)|0), x1 = Math.min(W, (ccx+R+1)|0);
    for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) {
      const dy = yy-ccy, dx = xx-ccx;
      if (dy*dy + dx*dx <= r2) { const p = (yy*W+xx)*4;
        px[p] = col[0]; px[p+1] = col[1]; px[p+2] = col[2]; }
    }
  }

  function drawFace(r, c, f) {
    const ox = c*S, oy = r*S;
    fill(ox+1,  oy+1, 4, 2, CHEEK);            // ほお（色はここだけ）
    fill(ox+19, oy+1, 4, 2, CHEEK);
    for (const ex of [ox+4, ox+15]) {
      if (f.yawn > 0 || f.blink > 0) {          // とじてる
        fill(ex, oy-5, 5, 5, INK);
        fill(ex, oy-3, 5, 1, PAPER);
      } else if (f.wide > 0) {                  // びっくり
        fill(ex-1, oy-6, 7, 7, INK);
        fill(ex+1, oy-4, 3, 3, PAPER);
      } else {                                  // ぶっちょうづら
        fill(ex, oy-5, 5, 5, INK);
        fill(ex+1, oy-2, 3, 2, PAPER);
      }
    }
    if (f.bang > 0) {                            // ！
      fill(ox+10, oy-17, 2, 6, CHEEK);
      fill(ox+10, oy-9,  2, 2, CHEEK);
    }
  }

  function paint() {
    fill(0, 0, W, WATER*S, PAPER);
    fill(0, WATER*S, W, H - WATER*S, WATERC);
    for (const l of LILY) disc(l[0], l[1], l[2], LILYC);
    let pop = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (grid[r*COLS+c]) { fill(c*S, r*S, S, S, INK); pop++; }
    }
    TOAD_AT.forEach((a,i) => { if (face[i].alive) drawFace(a[0], a[1], face[i]); });
    ctx.putImageData(img, 0, 0);                 // 転送は1フレームに1回
    document.getElementById('gen').textContent = gen;
    document.getElementById('pop').textContent = pop;
  }

  function animate() {
    if (running) {
      step();
      face.forEach(f => {
        if (f.blink > 0) f.blink--;
        if (f.wide  > 0) f.wide--;
        if (f.bang  > 0) f.bang--;
        if (f.yawn  > 0) f.yawn--;
        else if (f.blink === 0 && f.wide === 0 && Math.random() < 0.01) f.blink = 2;
      });
      if (gen > 0 && gen % (PERIOD * 3) === 0) {   // 3周ごとに、だれかがあくび
        const live = face.filter(f => f.alive);
        if (live.length) { live[(Math.random()*live.length)|0].yawn = 12; say('あくびした。', false); }
      }
    }
    paint();
  }

  function setSpeed() {
    if (timer) clearInterval(timer);
    timer = setInterval(animate, 1000 / +document.getElementById('speed').value);
  }

  document.getElementById('play').onclick = e => {
    running = !running; e.target.textContent = running ? 'とめる' : 'うごかす';
  };
  document.getElementById('stepb').onclick = () => { step(); paint(); };
  document.getElementById('reset').onclick = () => { build(); paint(); };
  document.getElementById('speed').oninput = setSpeed;

  document.getElementById('poke').onclick = () => {
    const live = TOAD_AT.map((a,i) => i).filter(i => face[i].alive);
    if (!live.length) { say('もう、だれもいない。', true); return; }
    const i = live[(Math.random()*live.length)|0], a = TOAD_AT[i];
    put(GLIDER, a[0]-12, a[1]-12);
    face[i].wide = 40; face[i].bang = 26;
    say('つついた。もどらない。', true);
    paint();
  };

  const atCell = ev => {
    const b = cv.getBoundingClientRect();
    return [ Math.floor((ev.clientY - b.top )/b.height * ROWS),
             Math.floor((ev.clientX - b.left)/b.width  * COLS) ];
  };
  cv.style.cursor = 'crosshair';
  cv.addEventListener('click', ev => {
    const [r,c] = atCell(ev);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
    grid[idx(r,c)] ^= 1;
    say('さわった。もどらない。', true);
    paint();
  });

  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const oc = () => { readTheme(); paint(); };
    mq.addEventListener ? mq.addEventListener('change', oc) : mq.addListener(oc);
  }

  build(); paint();
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    running = false;
    document.getElementById('play').textContent = 'うごかす';
  }
  setSpeed();
})();
</script>
</body>
</html>
