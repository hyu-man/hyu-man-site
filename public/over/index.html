<style>
:root{--paper:#fff6ef;--ink:#873e47;--pink:#ff719d;--pale:#ffd4df;--gold:#d8a66c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:DotGothic16,monospace}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit;text-underline-offset:5px}button:focus-visible,a:focus-visible,video:focus-visible{outline:3px solid var(--ink);outline-offset:5px}#hearts{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}header{padding:24px 5vw;display:flex;justify-content:space-between;font-size:12px;position:relative;z-index:4}header a{text-decoration:none}.hero{text-align:center;padding:25px 16px 24px}.eyebrow{font-size:10px;letter-spacing:.3em}h1{font-size:clamp(58px,10vw,130px);line-height:1.1;letter-spacing:-.06em;font-weight:400;margin:20px 0 6px}.aside{font-size:15px;color:#ba6578;margin:12px 0}.pair{width:240px;height:100px;margin:12px auto 0;image-rendering:pixelated}.stage{width:min(1060px,94vw);margin:0 auto;position:relative;box-shadow:12px 12px 0 var(--pale);border:1px solid #e4b4bb;background:var(--paper);z-index:2}.ribbon{display:flex;justify-content:space-between;padding:12px 15px;font-size:10px;letter-spacing:.12em;border-bottom:1px solid #e4b4bb}.screen{position:relative;aspect-ratio:16/9;background:var(--paper)}#world{display:block;width:100%;height:100%;object-fit:contain}.start{position:absolute;inset:0;display:grid;place-content:center;background:#fff6ef50}.start button,.again{border:1px solid var(--ink);color:var(--paper);background:var(--ink);padding:18px 30px;box-shadow:5px 5px 0 var(--pink);font-size:17px}.start span{font-size:11px;margin-top:18px;text-align:center}.controls{padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}.controls button{background:none;color:var(--ink);border:0;padding:8px}.below{text-align:center;position:relative;z-index:4;padding:42px 16px 25px}.fine{border:1px solid #cc929e;background:var(--paper);color:var(--ink);padding:13px 24px;min-width:150px}.answer{height:32px;margin:14px 0;color:#c94c76;font-size:18px}.end{margin:14px auto 35px}.end p{line-height:2}.music{font-size:11px;line-height:2.5;padding:20px 16px 45px;text-align:center}.error{padding:18px;line-height:1.8;text-align:center}[hidden]{display:none!important}body.playing .hero{opacity:.6}body.playing .stage{box-shadow:12px 12px 0 #ffafc5}.stage:fullscreen{width:100vw;height:100dvh;border:0;box-shadow:none;display:flex;flex-direction:column;background:#fff6ef}.stage:fullscreen .screen{flex:1;min-height:0;aspect-ratio:auto}.stage:fullscreen .ribbon{display:none}@media(max-width:600px){header{padding:18px 20px}.hero{padding-top:18px}h1{margin-top:18px}.pair{height:85px}.stage{box-shadow:5px 5px 0 var(--pale)}.ribbon{font-size:9px;padding:10px}.controls{padding:7px 10px;font-size:11px}.below{padding-top:30px}}@media(prefers-reduced-motion:reduce){#hearts{display:none}*{scroll-behavior:auto!important}}

<section class="hero"><div class="eyebrow">A LITTLE HEARTBREAK FILM</div><h1>It's Over!</h1><p class="aside">おわった。もう平気。</p><canvas class="pair" id="pair" width="240" height="100" aria-label="赤茶とピンクのふたり"></canvas></section>

</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),v=$('film'),canvas=$('hearts'),ctx=canvas.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');let motion=!reduce.matches,particles=[],w=innerWidth,h=innerHeight,last=0,spawn=0;
const shape=['0110110','1111111','1111111','0111110','0011100','0001000'];
function heart(c,x,y,s,color){c.fillStyle=color;shape.forEach((row,j)=>[...row].forEach((a,i)=>{if(a==='1')c.fillRect(Math.round(x+(i-3)*s),Math.round(y+(j-2)*s),Math.ceil(s),Math.ceil(s))}))}
function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function face(c,x,col){c.fillStyle=col;c.fillRect(x-18,25,36,38);c.fillRect(x-24,31,48,26);c.fillStyle='#fff6ef';c.fillRect(x-12,36,6,6);c.fillRect(x+6,36,6,6);c.fillRect(x-3,48,6,3);c.fillStyle='#ffb9cc';c.fillRect(x-18,46,8,5);c.fillRect(x+10,46,8,5)}const p=$('pair').getContext('2d');face(p,65,'#873e47');face(p,175,'#ff719d');heart(p,120,42,3,'#ff719d');
function add(n,x=w/2,y=h*.5){if(!motion)return;for(let i=0;i<n;i++){const a=i*2.39996;particles.push({x,y,vx:Math.cos(a)*(35+i%9*15),vy:Math.sin(a)*(45+i%7*16)-55,age:0,life:2+i%5*.3,s:1+i%4*.6,color:i%4===0?'#d8a66c':'#ff719d'})}if(particles.length>150)particles.splice(0,particles.length-150)}
function updateMotion(){ $('motion').textContent='ハート：'+(motion?'オン':'オフ');$('motion').setAttribute('aria-pressed',String(motion));if(!motion){particles=[];ctx.clearRect(0,0,w,h)}}updateMotion();$('motion').onclick=()=>{motion=!motion;updateMotion()};reduce.addEventListener('change',e=>{motion=!e.matches;updateMotion()});
function animate(now){const dt=Math.min((now-last)/1000,.04);last=now;ctx.clearRect(0,0,w,h);if(motion&&!document.hidden){if(!v.paused&&!v.ended){const t=v.currentTime;const chorus=(t>42&&t<71.6)||(t>91.6&&t<122)||(t>126&&t<151.97);spawn+=dt;if(spawn>(chorus?.1:.7)){spawn=0;add(chorus?3:1,(Math.sin(now*.001)*.45+.5)*w,h*.85)}}particles=particles.filter(q=>q.age<q.life);for(const q of particles){q.age+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=12*dt;ctx.globalAlpha=Math.max(0,1-q.age/q.life)*.65;heart(ctx,q.x,q.y,q.s,q.color)}ctx.globalAlpha=1}requestAnimationFrame(animate)}requestAnimationFrame(animate);
async function play(){try{await v.play();$('error').hidden=true}catch(e){$('start').hidden=false;$('error').hidden=false}}
$('play').onclick=play;v.addEventListener('play',()=>{$('start').hidden=true;$('end').hidden=true;document.body.classList.add('playing')});v.addEventListener('pause',()=>document.body.classList.remove('playing'));v.addEventListener('error',()=>{$('error').hidden=false;$('start').hidden=true});
const time=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');let previous=0;const drops=[42.0667,57.6667,65.3333,91.6,104.2667,121.9667,151.9667];
$('seek').addEventListener('input',()=>{if(Number.isFinite(v.duration)){v.currentTime=Number($('seek').value)/1000*v.duration;previous=v.currentTime}});
v.addEventListener('timeupdate',()=>{const t=v.currentTime;$('seek').value=Number.isFinite(v.duration)?Math.round(t/v.duration*1000):0;$('clock').textContent=time(t)+' / '+time(Number.isFinite(v.duration)?v.duration:154);if(t>=previous&&t-previous<1)for(const drop of drops)if(previous<drop&&t>=drop)add(70);previous=t});v.addEventListener('seeking',()=>{previous=v.currentTime});
v.addEventListener('ended',()=>{$('end').hidden=false;document.body.classList.remove('playing');add(70)});$('again').onclick=()=>{v.currentTime=0;previous=0;$('end').hidden=true;play()};
$('fine').onclick=()=>{$('answer').textContent='（ちがう）';const r=$('fine').getBoundingClientRect();add(55,r.x+r.width/2,r.y)};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('stage').requestFullscreen)await $('stage').requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}catch(e){v.controls=true}};
$('toggle').onclick=()=>v.paused?play():v.pause();v.addEventListener('play',()=>{$('toggle').textContent='Ⅱ 一時停止'});v.addEventListener('pause',()=>{$('toggle').textContent='▶ 再生'});
})();
</script><script src="world.js"></script></body></html>
