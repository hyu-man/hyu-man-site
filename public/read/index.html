<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>よむ — ひゅーまん</title>
<meta name="description" content="蟻が、自分の規則を読んでいます。">
<link rel="canonical" href="https://hyu-man.com/read/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ひゅーまん">
<meta property="og:title" content="よむ — ひゅーまん">
<meta property="og:description" content="蟻が、自分の規則を読んでいます。">
<meta property="og:url" content="https://hyu-man.com/read/">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><rect width='8' height='8' fill='%23f5f3f0'/><rect x='2' y='0' width='1' height='2' fill='%23111'/><rect x='5' y='0' width='1' height='2' fill='%23111'/><rect x='1' y='2' width='6' height='5' fill='%23111'/><rect x='2' y='4' width='4' height='1' fill='%23f5f3f0'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Hachi+Maru+Pop&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#f5f3f0; --ink:#1a1a1a; --sub:#b0a8a0; --line:#e2ded9; --cheek:#ff96aa;
    --dot:'Press Start 2P','DotGothic16','Courier New',monospace;
    --maru:'Hachi Maru Pop','DotGothic16',sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f0f0e; --ink:#efefec; --sub:#6e6a66; --line:#262624; }
  }
  body {
    background:var(--bg); color:var(--ink); font-family:var(--maru);
    display:flex; flex-direction:column; align-items:center;
    padding:34px 16px 60px;
  }
  h1 { font-family:var(--dot); font-size:13px; font-weight:400;
       letter-spacing:.3em; text-indent:.3em; margin-bottom:6px; }
  .lead { font-size:14px; color:var(--sub); letter-spacing:.05em; margin-bottom:22px; }

  .wrap { width:100%; max-width:760px; }
  .row { display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; }

  canvas {
    width:340px; max-width:100%; height:auto; aspect-ratio:1/1;
    image-rendering:pixelated; border:1px solid var(--line); display:block;
  }

  .keys {
    display:grid; grid-template-columns:repeat(4, 1fr); gap:6px;
    flex:1; min-width:230px;
  }
  .key {
    border:1px solid var(--line); border-radius:2px; padding:7px 4px 5px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .key .ch { font-size:17px; line-height:1; color:var(--sub); }
  .key.on { border-color:var(--cheek); }
  .key.on .ch { color:var(--cheek); }
  .nb { display:grid; grid-template-columns:repeat(3,4px);
        grid-template-rows:repeat(3,4px); gap:1px; }
  .nb i { background:var(--line); border-radius:1px; }
  .nb i.f { background:var(--ink); }
  .key.on .nb i.f { background:var(--cheek); }
  .nb .u { grid-area:1/2; } .nb .r { grid-area:2/3; }
  .nb .d { grid-area:3/2; } .nb .l { grid-area:2/1; }

  .stream {
    margin-top:18px; border-top:1px solid var(--line); padding-top:14px;
    font-size:17px; line-height:2.0; letter-spacing:.22em;
    color:var(--sub); word-break:break-all; min-height:6.4em;
  }
  .stream b { color:var(--cheek); font-weight:400; }

  .bar { display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-top:18px; }
  button {
    font-family:var(--maru); font-size:13px; letter-spacing:.06em;
    background:var(--bg); color:var(--ink); border:1px solid var(--ink);
    padding:5px 15px; cursor:pointer; border-radius:2px;
  }
  button:hover { background:var(--ink); color:var(--bg); }
  button.voice { border-style:dashed; }
  button.voice.on { background:var(--cheek); border-color:var(--cheek); color:var(--bg); }
  input[type=range] { width:130px; accent-color:var(--ink); }
  .rate { font-family:var(--dot); font-size:9px; color:var(--sub);
          font-variant-numeric:tabular-nums; }

  .note { margin-top:22px; font-size:12.5px; line-height:2.05; color:var(--sub); }
  .note b { color:var(--ink); font-weight:400; }
  .note .q { color:var(--cheek); }
  nav { margin-top:34px; font-family:var(--dot); font-size:9px;
        letter-spacing:.1em; color:var(--sub); }
  nav a { color:var(--sub); text-decoration:none; margin-right:13px; }
  nav a:hover { color:var(--ink); }

  /* 虹 */
  nav a, .fromrule a{
    text-decoration:none; border-bottom:0;
    background:linear-gradient(90deg,#ff0040,#ff8a00,#ffe600,#3ddc4a,#00b7ff,#8a4bff,#ff0040);
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text;
    color:transparent; animation:flow 4s linear infinite;
  }
  nav a:hover, .fromrule a:hover{ animation-duration:1.2s; }
  @keyframes flow{ from{background-position:0% 0} to{background-position:300% 0} }
  @media (prefers-reduced-motion: reduce){
    nav a, .fromrule a{ animation:none; background-position:50% 0; }
  }
</style>
</head>
<body>

<h1>よむ</h1>
<p class="lead">蟻が、自分の規則を読んでいます。</p>

<div class="wrap">
  <div class="row">
    <canvas id="cv" width="488" height="488" aria-label="ラングトンの蟻"></canvas>
    <div class="keys" id="keys"></div>
  </div>

  <div class="stream" id="stream"></div>

  <div class="bar">
    <button id="play">とめる</button>
    <button id="voice" class="voice">よませる</button>
    <button id="reset">さいしょから</button>
    <input type="range" id="speed" min="1" max="12" value="4" aria-label="はやさ">
    <span class="rate" id="rate">4 /s</span>
  </div>

  <p class="note">
    白なら右、黒なら左、踏んだ色を裏返して、一歩。<br>
    まわりの4マスの白黒は、4ビット＝<b>16通り</b>。
    この規則を書いた文にも、ちょうど<b>16文字</b>あります。<br>
    <span style="letter-spacing:.1em">しろならみぎ／くろならひだり／ふんだいろをうらがえし／いっぽ</span><br>
    対応させると、足跡がそのまま文字列になります。
    <b>規則が、規則自身の文字で喋る。</b><br>
    <span class="q">意味は出てきません。読めそうで、読めない。</span><br>
    声は、あなたの機械のものです。
  </p>

  <nav>
  <a href="/">ひゅーまん</a><a href="/ant/">/ant/</a><a href="/both/">/both/</a><a href="/play/">/play/</a><a href="/loop/">/loop/</a><a href="/chop/">/chop/</a><a href="/film/">/film/</a><a href="/still/">/still/</a>
</nav>
</div>

<script>
(() => {
  "use strict";
  const POOL = "しろならみぎくひだりふんいうがえ";      // 規則文にある16文字
  const N = 61, S = 8, M = 10, W = N * S, BATCH = 8;
  const DX = [0,1,0,-1], DY = [-1,0,1,0];               // 上 右 下 左

  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d", { alpha:false });
  const img = ctx.createImageData(W, W), px = img.data;
  for (let p = 3; p < px.length; p += 4) px[p] = 255;
  const base = new Uint8ClampedArray(px.length);

  const hex = s => { s = s.trim();
    if (s.length === 4) s = "#"+s[1]+s[1]+s[2]+s[2]+s[3]+s[3];
    return [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)]; };
  let INK, BG, CHEEK;
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    INK = hex(cs.getPropertyValue("--ink"));
    BG  = hex(cs.getPropertyValue("--bg"));
    CHEEK = hex(cs.getPropertyValue("--cheek"));
  }
  readTheme();

  // ---- 16のキー（どの向きが黒か、を点で示す） -------------------------
  const keyEls = [];
  for (let i = 0; i < 16; i++) {
    const el = document.createElement("div");
    el.className = "key";
    const b = [i & 1, (i >> 1) & 1, (i >> 2) & 1, (i >> 3) & 1];   // 上 右 下 左
    el.innerHTML = '<span class="ch">' + POOL[i] + '</span>' +
      '<span class="nb">' +
      '<i class="u' + (b[0] ? " f" : "") + '"></i>' +
      '<i class="r' + (b[1] ? " f" : "") + '"></i>' +
      '<i class="d' + (b[2] ? " f" : "") + '"></i>' +
      '<i class="l' + (b[3] ? " f" : "") + '"></i>' +
      '</span>';
    $("keys").appendChild(el);
    keyEls.push(el);
  }

  // ---- 蟻 --------------------------------------------------------------
  const grid = new Uint8Array(N*N);
  let x, y, dir, chars = [], pending = [], lastIdx = -1;

  function cell(cx, cy, col) {
    const x0 = cx*S, y0 = cy*S;
    for (let r = 0; r < S; r++) {
      let p = ((y0+r)*W + x0)*4;
      for (let c = 0; c < S; c++, p += 4) {
        base[p]=col[0]; base[p+1]=col[1]; base[p+2]=col[2]; base[p+3]=255;
      }
    }
  }
  const rebuild = () => {
    for (let cy = 0; cy < N; cy++) for (let cx = 0; cx < N; cx++)
      cell(cx, cy, grid[cy*N+cx] ? INK : BG);
  };
  function shift(dx, dy) {
    if (dy === 1)       { grid.copyWithin(N, 0, N*(N-1)); grid.fill(0, 0, N); }
    else if (dy === -1) { grid.copyWithin(0, N, N*N);     grid.fill(0, N*(N-1)); }
    if (dx === 1) { for (let r = 0; r < N; r++) { const b = r*N; grid.copyWithin(b+1, b, b+N-1); grid[b]=0; } }
    else if (dx === -1) { for (let r = 0; r < N; r++) { const b = r*N; grid.copyWithin(b, b+1, b+N); grid[b+N-1]=0; } }
    rebuild();
  }
  const at = (cx, cy) => (cx < 0 || cx >= N || cy < 0 || cy >= N) ? 0 : grid[cy*N+cx];

  function reset() {
    grid.fill(0); x = y = N >> 1; dir = 0;
    chars = []; pending = []; lastIdx = -1;
    rebuild(); render();
  }

  function step() {
    const i = y*N + x, on = grid[i] ^ 1;                 // 踏んだ色を裏返す
    grid[i] = on;
    dir = on ? (dir + 1) & 3 : (dir + 3) & 3;            // 白なら右、黒なら左
    cell(x, y, on ? INK : BG);
    x += DX[dir]; y += DY[dir];                          // 一歩
    if (x >= N-M) { shift(-1,0); x--; }
    if (x <  M)   { shift( 1,0); x++; }
    if (y >= N-M) { shift(0,-1); y--; }
    if (y <  M)   { shift(0, 1); y++; }

    // まわり4マスを読む。上=1 右=2 下=4 左=8
    const idx = at(x, y-1) | (at(x+1, y) << 1) | (at(x, y+1) << 2) | (at(x-1, y) << 3);
    lastIdx = idx;
    chars.push(POOL[idx]);
    pending.push(POOL[idx]);
    if (chars.length > 160) chars.splice(0, chars.length - 160);
    if (pending.length >= BATCH) { say(pending.join("")); pending = []; }
  }

  // ---- 描く ------------------------------------------------------------
  function boxf(cx, cy, w, h, col) {
    const x0 = Math.max(0,cx), y0 = Math.max(0,cy);
    const x1 = Math.min(W,cx+w), y1 = Math.min(W,cy+h);
    for (let yy = y0; yy < y1; yy++) {
      let p = (yy*W + x0)*4;
      for (let xx = x0; xx < x1; xx++, p += 4) { px[p]=col[0]; px[p+1]=col[1]; px[p+2]=col[2]; }
    }
  }
  function rot(t) {
    const [a,b,w,h] = t;
    if (dir === 0) return [a,b,w,h];
    if (dir === 1) return [-b-h, a, h, w];
    if (dir === 2) return [-a-w, -b-h, w, h];
    return [b, -a-w, h, w];
  }
  function drawAnt() {
    const ox = x*S + (S>>1), oy = y*S + (S>>1);
    boxf(ox-7, oy-8, 15, 17, INK);
    boxf(ox-8, oy-6, 17, 13, INK);
    for (const t of [[-5,-14,1,6],[4,-14,1,6]]) { const [a,b,w,h] = rot(t); boxf(ox+a,oy+b,w,h,INK); }
    for (const t of [[-7,-1,4,3],[4,-1,4,3]])   { const [a,b,w,h] = rot(t); boxf(ox+a,oy+b,w,h,CHEEK); }
    for (const t of [[-5,-7,3,3],[3,-7,3,3]])   { const [a,b,w,h] = rot(t); boxf(ox+a,oy+b,w,h,BG); }
  }
  function render() {
    px.set(base); drawAnt(); ctx.putImageData(img, 0, 0);
    const n = chars.length, cut = Math.max(0, n - pending.length);
    $("stream").innerHTML =
      chars.slice(0, cut).join("") + "<b>" + chars.slice(cut).join("") + "</b>";
    keyEls.forEach((el, i) => el.classList.toggle("on", i === lastIdx));
  }

  // ---- 声 --------------------------------------------------------------
  let speak = false, voice = null;
  function pickVoice() {
    if (!("speechSynthesis" in window)) return null;
    const vs = speechSynthesis.getVoices();
    return vs.find(v => v.lang === "ja-JP") || vs.find(v => v.lang.indexOf("ja") === 0) || null;
  }
  if ("speechSynthesis" in window) {
    voice = pickVoice();
    speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); };
  }
  function say(text) {
    if (!speak || !("speechSynthesis" in window)) return;
    if (speechSynthesis.speaking || speechSynthesis.pending) return;   // 溜めない
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 0.85; u.pitch = 1.0; u.volume = 0.9;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }

  // ---- ループ ----------------------------------------------------------
  let run = true, per = 4, acc = 0, prev = 0;
  function frame(t) {
    if (!prev) prev = t;
    const dt = Math.min(t - prev, 250); prev = t;
    if (run) {
      acc += dt * per / 1000;
      let k = 0;
      while (acc >= 1 && k < 60) { acc -= 1; step(); k++; }
    }
    render();
    requestAnimationFrame(frame);
  }

  $("play").onclick = e => { run = !run; e.target.textContent = run ? "とめる" : "あるかせる"; };
  $("reset").onclick = () => reset();
  $("speed").oninput = e => { per = +e.target.value; $("rate").textContent = per + " /s"; };
  $("voice").onclick = e => {
    if (!("speechSynthesis" in window)) { e.target.textContent = "声がありません"; return; }
    speak = !speak;
    e.target.classList.toggle("on", speak);
    if (speak) {
      voice = voice || pickVoice();
      e.target.textContent = voice ? "よんでる" : "日本語の声がない";
      speechSynthesis.speak(new SpeechSynthesisUtterance(" "));   // 権限をもらう
    } else {
      e.target.textContent = "よませる";
      speechSynthesis.cancel();
    }
  };
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const oc = () => { readTheme(); rebuild(); render(); };
    mq.addEventListener ? mq.addEventListener("change", oc) : mq.addListener(oc);
  }

  reset();
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    run = false; $("play").textContent = "あるかせる";
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
